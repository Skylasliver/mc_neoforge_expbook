plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'skylasliver_expbook'
        }
    }
    mods {
        "skylasliver_expbook" { sourceSet(sourceSets.main) }
    }
}

// Lifecycle integration checks are compiled only for the managed GameTest run.
if (gradle.startParameter.taskNames.any { it.toLowerCase(java.util.Locale.ROOT).contains('gametest') }) {
    sourceSets.main.java.srcDir 'src/gametest/java'
    sourceSets.main.resources.srcDir 'src/gametest/resources'
}

sourceSets {
    regression {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
tasks.register('regressionChecks', JavaExec) {
    dependsOn regressionClasses
    classpath = sourceSets.regression.runtimeClasspath
    mainClass = 'dev.skylasliver.skylasliver_expbook.RegressionChecks'
}
tasks.named('check') { dependsOn 'regressionChecks' }

processResources {
    filteringCharset = 'UTF-8'
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}

tasks.configureEach {
    if (name in ['runClient', 'runServer', 'runGameTestServer']) {
        dependsOn 'processResources', 'classes'
    }
}

dependencies {



// MODMIND DEPENDENCIES START
    implementation files('libs/skylasliver/jei-1.21.1-neoforge-19.57.0.449.jar')
    implementation files('libs/skylasliver/jecharacters-1.21.1-neoforge-4.5.29.jar')
    implementation files('libs/skylasliver/IMBlocker-5.6.1-neoforge+1.20.6-1.21.8.jar')
    implementation files('libs/skylasliver/iconexporter-1.21.1-neoforge-1.4.2-220.jar')
    implementation files('libs/skylasliver/mezz_config-1.21.1-neoforge-0.6.3.jar')
    implementation files('libs/skylasliver/cyclopscore-1.21.1-neoforge-1.30.0.jar')
// MODMIND DEPENDENCIES END
}
